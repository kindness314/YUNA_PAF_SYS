services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yuna
      POSTGRES_PASSWORD: yuna
      POSTGRES_DB: yuna
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuna"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

  server:
    build: ./server
    environment:
      YUNA_DATABASE_URL: postgresql+psycopg://yuna:yuna@db:5432/yuna
      YUNA_REDIS_URL: redis://redis:6379/0
      YUNA_AUTO_CREATE_DB: "false"
      YUNA_JWT_SECRET: ${YUNA_JWT_SECRET:?set YUNA_JWT_SECRET in .env}
    ports:
      - "8100:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
